# jxsuite.com publishes the RELEASED tree, never the trunk, so the docs a visitor reads always
# describe the app they can actually download. That splits this workflow in two:
#
#   * `build` runs on pull requests and on `main`, and proves the site still compiles at the moment
#     someone breaks it rather than weeks later on release day. It publishes nothing.
#   * `deploy` runs only when a ref was handed in — i.e. from release-please.yml at the desktop tag
#     it just advanced `release` to, or from a deliberate manual dispatch.
#
# It has to be INVOKED rather than triggered. `advance-release-branch` moves `release` with a plain
# GITHUB_TOKEN push, and pushes made with that token do not start workflows — the same reason the
# publish and desktop-bundler jobs are `uses:` calls instead of `on: push: tags`. An
# `on: push: branches: [release]` trigger here would look right and simply never fire.
#
# The cost, accepted deliberately: a docs change on `main` reaches the site only when the desktop
# component next releases. `workflow_dispatch` with `ref: main` is the escape hatch.
name: Deploy jxsuite.com

on:
  # Build-only; nothing here publishes.
  #
  # `packages/compiler/**` is in the list because `perf:budget` runs in this job, and the compiler is
  # where every regression it exists to catch actually lives: unminified bundles, a stylesheet link
  # per component, an oversized image variant. A budget that cannot see the code it guards is
  # decoration. The cost is a site build on compiler pull requests, which the image cache keeps
  # cheap; the alternative is finding out on release day.
  pull_request:
    paths:
      - "sites/jxsuite.com/**"
      - "docs/**"
      - "scripts/docs/**"
      - "packages/compiler/**"
      - "scripts/check-site-perf-budget.ts"
      # The sources of the derived docs pages (`scripts/docs/generators/pages.ts`). The pages are
      # gitignored build outputs, so a spec release, a formula, a route, a starter or a command
      # no longer carries a page under docs/** — the build has to be asked for by its inputs.
      - "specs/**"
      - "packages/formulas/**"
      - "packages/protocol/**"
      - "packages/starters/registry.json"
      - "packages/studio/src/commands/**"
      - "packages/schema/schema.json"
  push:
    branches: [main]
    paths:
      - "sites/jxsuite.com/**"
      - "docs/**"
      - "scripts/docs/**"
      - "packages/compiler/**"
      - "scripts/check-site-perf-budget.ts"
      # The sources of the derived docs pages (`scripts/docs/generators/pages.ts`). The pages are
      # gitignored build outputs, so a spec release, a formula, a route, a starter or a command
      # no longer carries a page under docs/** — the build has to be asked for by its inputs.
      - "specs/**"
      - "packages/formulas/**"
      - "packages/protocol/**"
      - "packages/starters/registry.json"
      - "packages/studio/src/commands/**"
      - "packages/schema/schema.json"
  workflow_call:
    inputs:
      ref:
        description: "Tree to publish. The release pipeline passes the desktop tag it just shipped."
        required: false
        default: release
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: "Tree to publish. `release` is the last shipped tree; `main` publishes unreleased work."
        required: false
        default: release
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Every publish shares one group, so a newer release supersedes an older deploy. Build-only runs
  # are keyed per ref instead — otherwise a pull request would cancel a release's deploy.
  group: pages-${{ inputs.ref && 'publish' || github.ref }}
  cancel-in-progress: true

jobs:
  # The pictures. `docs/images/` is a build output (scripts/screenshots/README.md): no screenshot is
  # committed, so a publish captures them from the tree it is about to publish, in the pinned
  # browser container, and `build` picks them up as an artifact. That is a few minutes per release,
  # and it is what makes the site's pictures the pictures of the Studio that shipped.
  #
  # Only a publish pays for it. A build-only run restores the most recent capture `main` saved
  # instead (the step below), which is close enough for a build that publishes nothing.
  capture:
    if: inputs.ref
    uses: ./.github/workflows/screenshots.yml
    with:
      ref: ${{ inputs.ref }}

  build:
    needs: capture
    # `capture` is SKIPPED on every build-only run, and a skipped need skips its dependants unless
    # they say otherwise. A capture that FAILED still stops the publish here.
    if: ${{ !cancelled() && (needs.capture.result == 'success' || needs.capture.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # An empty `ref` is exactly what actions/checkout does by default (the triggering ref), so
      # this one line covers the release call and the pull request alike.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-bun
        with:
          # This job runs its own (non-frozen) install below.
          install: "false"

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      # The compiler's image cache is content-addressed (contentHash:configHash) and
      # self-invalidating, so this key only governs when a fresh snapshot is saved:
      # any deploy-triggering change produces a new key, while restore-keys restores
      # the most recent prior cache so only new/changed images get re-encoded.
      - uses: actions/cache@v6
        with:
          path: ~/.npm/jxsuite-images
          key: jxsuite-images-${{ hashFiles('sites/jxsuite.com/**', 'docs/**', 'scripts/docs/**') }}
          restore-keys: |
            jxsuite-images-

      # ── The pictures ───────────────────────────────────────────────────────
      # Publishing: exactly what `capture` just took of this tree.
      - if: inputs.ref
        uses: actions/download-artifact@v8
        with:
          name: docs-images
          path: .

      # Build-only: the most recent capture `main` saved, best effort. The key never exists, so
      # this always falls through to the prefix. The path list is screenshots.yml's CAPTURE_PATHS
      # verbatim: `actions/cache` hashes it into the cache's version, so a different list is a
      # different cache and restores nothing. With nothing restored (a first run, or the cache
      # aged out) the build still passes: the compiler leaves an image it cannot find alone, and
      # the pages come out with broken pictures that nobody is going to be served.
      - if: ${{ !inputs.ref }}
        uses: actions/cache/restore@v6
        with:
          path: |
            docs/images
            scripts/screenshots/capture.lock.json
          key: screenshots-v1-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            screenshots-v1-

      - run: bun install

      # A publish builds only from a capture that is whole, produced by the runner, and current
      # for this tree. `capture` checked that before uploading; this checks what ARRIVED, because
      # an artifact is bytes that crossed a job boundary and the lock is what says they are intact.
      - if: inputs.ref
        run: bun scripts/check-image-lock.ts --capture

      # Gate the deploy on marketing-copy truthfulness before anything is built or published.
      - run: bun run docs:claims

      - run: bun run generate:schema

      - run: bun run build:parser

      # The site's images are encoded by the compiler's Rust core.
      - uses: ./.github/actions/setup-rust
      - run: bun run build:addon

      - run: bun run build:compiler

      - run: bun run --cwd sites/jxsuite.com build

      # After the build, because it measures the emitted bytes rather than the source.
      - run: bun run perf:budget

      - if: inputs.ref
        uses: actions/configure-pages@v6

      - if: inputs.ref
        uses: actions/upload-pages-artifact@v5
        with:
          path: sites/jxsuite.com/dist

  deploy:
    needs: build
    if: inputs.ref
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
