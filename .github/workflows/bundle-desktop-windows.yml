name: Build Desktop (Windows)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach artifacts to.
        required: true
        type: string

jobs:
  build:
    name: Build (windows-x64)
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: ./.github/actions/setup-bun
        with:
          # This job runs its own (non-frozen) install below.
          install: "false"

      - name: Install dependencies
        run: bun install

      - name: Build workspace packages
        run: bun run build

      # One run builds both Windows packages: the NSIS installer people download and electron-updater
      # replaces in place, and the appx the Microsoft Store lane (store-publish.yml) submits.
      # Neither is signed here: the Store signs its package, and the installer is unsigned today
      # (packages/desktop/release-assets.json says so).
      - name: Build the installer and the Store package
        run: bun run --cwd packages/desktop package --target win --arch x64 -- --publish never

      # What was packaged, not the sources (packages/desktop/scripts/smoke-backend.ts). Not yet
      # proven on Windows, so a failure here is reported without withholding the installer; make it
      # blocking once it has been green across a release.
      - name: Smoke-test the packaged backend
        continue-on-error: true
        run: bun run --cwd packages/desktop smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            packages/desktop/artifacts/*.exe
            packages/desktop/artifacts/*.appx
            packages/desktop/artifacts/*.blockmap
            packages/desktop/artifacts/latest*.yml
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        # Run even when a step failed, so any artifacts that DID land in packages/desktop/artifacts/
        # still reach the release. action-gh-release no-ops on an empty glob
        # (fail_on_unmatched_files defaults false), so a total build failure leaves the job red
        # without adding a spurious error.
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so electron-updater's
          # releases/latest/download/ feed resolves here. Idempotent across the concurrent bundler
          # attach jobs.
          make_latest: true
          files: |
            packages/desktop/artifacts/*.exe
            packages/desktop/artifacts/*.appx
            packages/desktop/artifacts/*.blockmap
            packages/desktop/artifacts/latest*.yml
