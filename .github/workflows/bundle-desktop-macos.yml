name: Build Desktop (macOS)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach artifacts to.
        required: true
        type: string
  # A manual run builds, signs, notarizes and verifies from the branch it is started on, then
  # uploads the installers as a workflow artifact. With no tag it attaches nothing to any release.
  workflow_dispatch:

jobs:
  build:
    name: Build (macos-arm64)
    # Apple Silicon only: there has been no Intel Mac build since the 1.18 toolchain, and Intel users
    # stay on the last release built with it.
    #
    # Pinned to macos-15 (arm64 GA image), NOT macos-latest: on 2026-06-15 `macos-latest` migrated to
    # the macOS 26 beta image, which a release should not be the first thing to run on.
    runs-on: macos-15

    permissions:
      contents: write

    env:
      # A step's `if` cannot read the secrets context, so what is configured is decided once, here.
      # Without the certificate the build is unsigned, and without the API key it is not notarized;
      # electron-builder says so and carries on, so a fork or a first run still produces a dmg.
      HAS_APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      - name: Build workspace packages
        run: bun run build

      # notarytool reads an App Store Connect API key from a file; electron-builder is told where.
      - name: Write the Apple API key file
        if: env.HAS_APPLE_API_KEY == 'true'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.apple/keys
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      # TEMPORARY: says which half of the certificate pair is wrong. Prints lengths and verdicts only.
      - name: Diagnose the signing certificate secrets
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "base64 length: ${#CERT_B64}; password length: ${#CERT_PW}"
          case "$CERT_PW" in *[[:space:]]) echo "password ENDS with whitespace" ;; esac
          case "$CERT_PW" in [[:space:]]*) echo "password STARTS with whitespace" ;; esac
          printf '%s' "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/diag.p12" || echo "base64 decode FAILED"
          echo "decoded bytes: $(wc -c < "$RUNNER_TEMP/diag.p12")"
          if openssl pkcs12 -info -noout -passin env:CERT_PW -in "$RUNNER_TEMP/diag.p12" > /dev/null 2>&1; then
            echo "openssl: password OPENS the p12"
          else
            echo "openssl: password does NOT open the p12 (or a legacy algorithm needs -legacy)"
            openssl pkcs12 -info -noout -legacy -passin env:CERT_PW -in "$RUNNER_TEMP/diag.p12" > /dev/null 2>&1 \
              && echo "openssl -legacy: password OPENS the p12" || echo "openssl -legacy: still fails"
          fi
          security create-keychain -p tmp "$RUNNER_TEMP/diag.keychain-db"
          security import "$RUNNER_TEMP/diag.p12" -k "$RUNNER_TEMP/diag.keychain-db" -P "$CERT_PW" -T /usr/bin/codesign 2>&1 | sed 's/^/security: /'
          security find-identity -p codesigning "$RUNNER_TEMP/diag.keychain-db" | sed 's/[0-9A-F]\{40\}/<hash>/'
          rm -f "$RUNNER_TEMP/diag.p12"
          security delete-keychain "$RUNNER_TEMP/diag.keychain-db" || true

      # electron-builder imports CSC_LINK (a base64 .p12) into a keychain of its own, signs the
      # application and the Bun inside it with the hardened runtime, notarizes, and staples.
      - name: Build the installers
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: /Users/runner/.apple/keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bun run --cwd packages/desktop package --target mac --arch arm64 -- --publish never

      # What was packaged, not the sources: the backend starts under the Bun that ships beside it
      # and does the things a bundle can lose (packages/desktop/scripts/smoke-backend.ts).
      - name: Smoke-test the packaged backend
        run: bun run --cwd packages/desktop smoke

      - name: Verify the signature
        if: env.HAS_APPLE_API_KEY == 'true'
        run: |
          app="packages/desktop/artifacts/mac-arm64/Jx Studio.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      - name: Clean up signing materials
        if: always()
        run: rm -f ~/.apple/keys/AuthKey_*.p8

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-arm64
          path: |
            packages/desktop/artifacts/*.dmg
            packages/desktop/artifacts/*.zip
            packages/desktop/artifacts/*.blockmap
            packages/desktop/artifacts/latest*.yml
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        # Run even when a step failed, so any artifacts that DID land in packages/desktop/artifacts/
        # still reach the release. action-gh-release no-ops on an empty glob
        # (fail_on_unmatched_files defaults false), so a total build failure leaves the job red
        # without adding a spurious error.
        if: ${{ !cancelled() && inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so electron-updater's
          # releases/latest/download/ feed resolves here. Idempotent across the concurrent bundler
          # attach jobs.
          make_latest: true
          files: |
            packages/desktop/artifacts/*.dmg
            packages/desktop/artifacts/*.zip
            packages/desktop/artifacts/*.blockmap
            packages/desktop/artifacts/latest*.yml
