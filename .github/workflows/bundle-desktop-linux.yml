name: Build Desktop (Linux)

on:
  workflow_call:
    inputs:
      tag_name:
        description: Tag to build and attach artifacts to.
        required: true
        type: string

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
          # electron-builder packages for the host's architecture, so arm64 needs a native runner
          # rather than a cross-compile flag.
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned; keep in sync with the canonical pin in test.yml.
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      - name: Build workspace packages
        run: bun run build

      # The AppImage is the one Linux package electron-updater can replace in place. The snap
      # (build-snap.yml) and the Nix package are separate channels with their own updaters.
      - name: Build the AppImage
        run: bun run --cwd packages/desktop package --target linux --arch ${{ matrix.arch }} -- --publish never

      # What was packaged, not the sources (packages/desktop/scripts/smoke-backend.ts).
      - name: Smoke-test the packaged backend
        run: bun run --cwd packages/desktop smoke

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            packages/desktop/artifacts/*.AppImage
            packages/desktop/artifacts/latest*.yml
          if-no-files-found: error
          retention-days: 7

      - name: Attach to release
        # Run even when a step failed, so any artifacts that DID land in packages/desktop/artifacts/
        # still reach the release. action-gh-release no-ops on an empty glob
        # (fail_on_unmatched_files defaults false), so a total build failure leaves the job red
        # without adding a spurious error.
        if: ${{ !cancelled() }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          draft: false
          # Force the desktop release to be GitHub's "latest" so electron-updater's
          # releases/latest/download/ feed resolves here. Idempotent across the concurrent bundler
          # attach jobs.
          make_latest: true
          files: |
            packages/desktop/artifacts/*.AppImage
            packages/desktop/artifacts/latest*.yml
