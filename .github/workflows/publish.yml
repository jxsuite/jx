name: Publish to npm
permissions:
  id-token: write
  contents: read
  # The publish step files unpublished packages on the release-incomplete issue.
  issues: write

# `workflow_call` ONLY, from release-please.yml, for every publish INCLUDING a backfill.
#
# Authentication is npm trusted publishing (OIDC): npm accepts the token only when the workflow
# file that requested it is the one each package's trusted publisher names. Called as a reusable
# workflow, that file is release-please.yml. Dispatched directly, it was publish.yml, and npm
# refused every package with `E404 Not Found - PUT` (run 39607367057, and a July dispatch before
# it). So the backfill entry point is release-please.yml's own `workflow_dispatch`:
#
#   gh workflow run release-please.yml -f backfill_paths='["packages/runtime"]' -f backfill_sha=<release commit or tag>
#
# There is deliberately no `workflow_dispatch` here: a trigger that can only fail is a trap.
on:
  workflow_call:
    inputs:
      paths_released:
        description: JSON array of package paths to publish (released this run, or a backfill).
        required: true
        type: string
      sha:
        description: Release commit (all component tags point here).
        required: false
        type: string
        default: ""

jobs:
  # The compiler's Rust core, built once per platform npm installs it on. Each leg uploads one
  # `jx-compiler.<triple>.node`; the publish job turns the set into npm packages
  # (scripts/addon-packages.ts). The triples are `RELEASE_TRIPLES` in
  # packages/compiler-binding/src/triple.ts, and scripts/addon-lanes.test.ts holds this matrix to
  # that list.
  #
  # Only when a release carries the loader: `packages/compiler` matches both
  # `packages/compiler` (which inlines it into dist/cli.js) and `packages/compiler-binding`.
  #
  # UNVERIFIED UNTIL A RELEASE HAS RUN IT, like every release-only lane (.github/AGENTS.md). The
  # Linux x64 glibc leg is the build every pull request already makes; the other seven have never
  # run. Linux builds on 22.04 so the addon needs glibc 2.35 rather than the newest runner's.
  addon:
    if: contains(inputs.paths_released, 'packages/compiler')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: linux-x64-gnu, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { triple: linux-x64-musl, os: ubuntu-22.04, target: x86_64-unknown-linux-musl }
          - { triple: linux-arm64-gnu, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { triple: linux-arm64-musl, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-musl }
          - { triple: darwin-x64, os: macos-latest, target: x86_64-apple-darwin }
          - { triple: darwin-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { triple: win32-x64-msvc, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { triple: win32-arm64-msvc, os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          # The build script imports nothing outside its own package.
          install: "false"
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
      # A musl `cdylib` must link the C library dynamically (Rust's musl targets default to
      # static, which cannot produce a loadable addon), through musl's own compiler driver.
      - if: endsWith(matrix.triple, '-musl')
        shell: bash
        run: |
          sudo apt-get install -y -qq musl-tools
          echo "RUSTFLAGS=-C target-feature=-crt-static" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
      - run: bun packages/compiler-binding/scripts/build.ts --target ${{ matrix.target }} --as ${{ matrix.triple }}
      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ matrix.triple }}
          path: packages/compiler-binding/jx-compiler.${{ matrix.triple }}.node
          if-no-files-found: error

  publish:
    needs: addon
    # `skipped` is the ordinary case (a release without the compiler). A FAILED addon leg stops the
    # whole publish, because a compiler published without the platform packages it names installs
    # everywhere and encodes images nowhere; re-run the failed leg, then this job.
    if: ${{ !cancelled() && needs.addon.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/setup-bun
        with:
          # This job runs its own (non-frozen) install below.
          install: "false"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: bun install
      # `bun run build` compiles the compiler's Rust core first (`build:addon`).
      - uses: ./.github/actions/setup-rust
      - run: bun run build
      # The publish TOOLING comes from the caller's ref (github.sha is the dispatched branch head,
      # or the release commit on a normal run), while the packages above come from `inputs.sha`.
      # A backfill from a release tag checks out a tree that may predate publish-released.ts
      # entirely (runtime-v5.0.0 does), so running the script from that tree would fail with
      # module-not-found before publishing anything. Every script it runs reads the workspace from
      # the working directory, so the old tree's packages and versions are what gets published.
      # Checked out AFTER the build so nothing in it can join the install or the build.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          sparse-checkout: scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # scripts/publish-released.ts takes the publish set and its topological order from
      # scripts/publish-order.ts (released AND npm-publishable, derived, never a hand-kept list),
      # then attempts EVERY package even when one fails. It used to be a `set -e` bash loop, which
      # died at a new package with no trusted publisher (@jxsuite/catalog, run 39048400671) and
      # never attempted site@2.0.5 or runtime@5.0.0 behind it. It writes a per-package table to the
      # job summary and exits 1 at the end when anything failed. Idempotent: a version already on
      # npm is skipped.
      - if: needs.addon.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: addon-*
          merge-multiple: true
          path: addon-artifacts
      # Writes packages/compiler-binding/npm/<triple>/ and lists each as an optionalDependency of
      # the two packages that run the loader. publish-released.ts publishes those directories
      # first. Never committed: the versions it names do not exist until this step's run ends.
      - name: Package the compiler addon for every platform
        if: needs.addon.result == 'success'
        run: bun .release-tools/scripts/addon-packages.ts addon-artifacts
      - name: Publish released packages (topological, every package attempted)
        env:
          PATHS_RELEASED: ${{ inputs.paths_released }}
          RELEASE_SHA: ${{ inputs.sha || github.sha }}
        run: bun .release-tools/scripts/publish-released.ts --issue-body publish-issue.md
      # The publish job's own deterministic outcome, filed on the ONE issue verify-release-integrity
      # also uses. It is not a registry probe, so it cannot race npm's write lag the way the removed
      # one did (.github/AGENTS.md, "The post-merge gate does not ask npm").
      - name: File unpublished packages on the release-incomplete issue
        if: failure() && hashFiles('publish-issue.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          title="Released versions that never shipped"
          open="$(gh issue list --state open --label release-incomplete \
                    --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -z "$open" ]; then
            gh label create release-incomplete --color B60205 \
              --description "A release shipped incomplete: a missing asset, publish, tag or cache entry" \
              2>/dev/null || true
            gh issue create --title "$title" --label release-incomplete --body-file publish-issue.md
          else
            gh issue comment "$open" --body-file publish-issue.md
          fi
