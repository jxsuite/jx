# Builds the Ubuntu snap of Jx Studio and attaches it to the desktop release, the way
# bundle-desktop-windows.yml does for the Microsoft Store package. snap-publish.yml takes it from the
# release to the Snap Store.
#
# The snap carries the same Electron application every other channel ships: electron-builder's
# unpacked Linux build, staged beside snapcraft.yaml. snapcraft wraps it with the gnome runtime's
# GTK and GPU stack and Canonical's Chromium build (the site import's browser)
# (packages/desktop/snap/snapcraft.yaml says why).
#
# Two native runners, because nothing here cross-compiles, and both pinned to 24.04 rather than
# `ubuntu-latest`: `--destructive-mode` builds on the host, which must match the snap's core24 base.
name: Build snap

on:
  workflow_call:
    inputs:
      tag_name:
        description: Desktop release tag to build and attach the snaps to (e.g. desktop-v5.3.0).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Desktop release tag to build and attach to. Leave blank to build the current ref and keep
          the snaps as workflow artifacts only.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Snap (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - uses: ./.github/actions/setup-bun

      # The unpacked build, not an AppImage: snapcraft wants the files. `--dir` runs the whole stage
      # (backend bundle and its native modules, studio assets) and stops before the installer is made.
      - name: Build the unpacked Linux app and stage it
        run: |
          set -euo pipefail
          bun run --cwd packages/desktop package --target linux --arch ${{ matrix.arch == 'amd64' && 'x64' || 'arm64' }} -- --dir --publish never
          unpacked="$(find packages/desktop/artifacts -maxdepth 1 -type d -name 'linux*-unpacked' | head -n 1)"
          test -n "$unpacked"
          test -x "$unpacked/jx-studio"
          cp -r "$unpacked" packages/desktop/snap-stage
          bun -e 'console.log(require("./packages/desktop/package.json").version)' > packages/desktop/snap-stage/version.txt

      - name: The staged backend starts under the Electron that ships in the snap
        run: bun run --cwd packages/desktop smoke --electron snap-stage/jx-studio

      # The chown is load-bearing. `sudo` leaves the snap owned by root, and review-tools is a strict
      # snap whose only file access is the `home` interface, whose AppArmor rule is
      # `owner @{HOME}/[^.]** rwkl`: a root-owned file under $HOME is denied to the runner user at
      # any mode. That was desktop-v5.3.0's `[Errno 13] Permission denied ... RUNTIME ERROR`.
      - name: Pack the snap
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic
          sudo snapcraft pack --destructive-mode
          mkdir -p "$GITHUB_WORKSPACE/snap-out"
          sudo mv ./*.snap "$GITHUB_WORKSPACE/snap-out/"
          sudo chown "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"/snap-out/*.snap
          ls -la "$GITHUB_WORKSPACE/snap-out"

      # The store's own automated review, run before upload so a rejection is a red build in the
      # release run rather than an email after it.
      # Judged on the verdict line, which must say `pass`, as well as the exit code: the tool exits 0
      # on a `FAIL` and on a `RUNTIME ERROR` verdict alike (measured: a setuid chrome-sandbox it
      # could not unpack came back `RUNTIME ERROR`, exit 0), so anything but `pass` is red.
      - name: Store review
        run: |
          set -euo pipefail
          sudo snap install review-tools
          for snap in snap-out/*.snap; do
            status=0
            out="$(review-tools.snap-review "$snap" 2>&1)" || status=$?
            echo "$out"
            if [ "$status" -ne 0 ] || ! grep -qE "^$(basename "$snap"): pass$" <<<"$out"; then
              echo "::error::$(basename "$snap") failed the Snap Store's automated review"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: snap-${{ matrix.arch }}
          path: snap-out/*.snap
          retention-days: 30

      - name: Attach to the release
        if: ${{ !cancelled() && inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag_name }}
          files: snap-out/*.snap
