# Builds the Mac App Store package, uploads it to App Store Connect (where it lands in TestFlight),
# and then submits it to App Review, so a desktop release reaches the store with nothing left to
# click. specs/desktop.md §7.7 is the contract and packages/desktop/AGENTS.md's "Mac App Store
# Publishing" section has the one-time setup.
#
# The submission is its own job (`mas-submit`), so a failure there is retried with "Re-run failed
# jobs" without building and uploading a second package, which Apple would refuse for its repeated
# build number. A release calls it with `submit` on; `workflow_dispatch` leaves it off unless asked,
# so a run from a branch only reaches TestFlight.
#
# It is a lane of its own and not a step of bundle-desktop-macos.yml, because nothing about it is
# shared with the DMG except the staged application: the identity, the container, the entitlements
# and the upload are all different, and a failure here must not hold up the notarized DMG.
#
# Called from release-please.yml at the desktop release tag. `workflow_dispatch` builds and uploads
# from the branch it is started on (no tag), which is how the first run is made.
name: Publish to the Mac App Store

on:
  workflow_call:
    inputs:
      tag_name:
        description: Desktop release tag to build and upload.
        required: true
        type: string
      submit:
        description: Submit the uploaded build to App Review.
        default: true
        type: boolean
      release_type:
        description: MANUAL (a person releases the approved version) or AFTER_APPROVAL (the store does).
        default: MANUAL
        type: string
  workflow_dispatch:
    inputs:
      submit:
        description: Submit the uploaded build to App Review.
        default: false
        type: boolean
      release_type:
        description: MANUAL (a person releases the approved version) or AFTER_APPROVAL (the store does).
        default: MANUAL
        type: choice
        options:
          - MANUAL
          - AFTER_APPROVAL

permissions:
  contents: read

jobs:
  mas-publish:
    name: Upload to App Store Connect (macos-arm64)
    # Pinned to macos-15 for bundle-desktop-macos.yml's reason: a release must not be the first run
    # on a beta image.
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      # The build number the package carries (`-c.mac.bundleVersion` below), which the submission
      # looks the build up by; and whether anything was uploaded at all, since a missing secret
      # skips every step and leaves nothing to submit.
      build_number: ${{ github.run_number }}
      uploaded: ${{ steps.credentials.outputs.configured }}

    steps:
      # A no-op until every secret exists, so the lane can merge before App Store Connect is set up.
      # A warning rather than silence: seven of eight set is a setup mistake worth seeing.
      - name: Check the App Store credentials
        id: credentials
        env:
          MAS_CERTIFICATE_BASE64: ${{ secrets.MAS_CERTIFICATE_BASE64 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MAS_INSTALLER_CERTIFICATE_BASE64 }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          missing=()
          for name in MAS_CERTIFICATE_BASE64 MAS_CERTIFICATE_PASSWORD MAS_INSTALLER_CERTIFICATE_BASE64 MAS_INSTALLER_CERTIFICATE_PASSWORD MAS_PROVISIONING_PROFILE_BASE64 APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning::Mac App Store credentials not configured (missing ${missing[*]}); skipping the upload. See packages/desktop/AGENTS.md, \"Mac App Store Publishing\"."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.configured == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      - name: Set up Bun and the dependencies
        if: steps.credentials.outputs.configured == 'true'
        uses: ./.github/actions/setup-bun

      # `bun run build` compiles the compiler's Rust core first (`build:addon`), and staging copies
      # the addon beside the backend bundle.
      - name: Set up Rust
        if: steps.credentials.outputs.configured == 'true'
        uses: ./.github/actions/setup-rust

      - name: Build workspace packages
        if: steps.credentials.outputs.configured == 'true'
        run: bun run build

      # The profile is embedded in the app and is what makes the entitlements valid; the API key is
      # where altool looks for it. Neither is ever printed.
      - name: Write the provisioning profile and the API key
        if: steps.credentials.outputs.configured == 'true'
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > packages/desktop/build-resources/embedded.provisionprofile
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      # electron-builder imports both certificates into a keychain of its own: CSC_LINK signs the
      # application, CSC_INSTALLER_LINK the .pkg. Both .p12 files must use the legacy algorithms
      # (3DES, SHA-1 MAC): macOS's `security import` rejects OpenSSL 3's default format with a
      # misleading "MAC verification failed". The build number must rise on every upload, and a
      # workflow run number does.
      - name: Build the Mac App Store package
        if: steps.credentials.outputs.configured == 'true'
        env:
          CSC_LINK: ${{ secrets.MAS_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.MAS_INSTALLER_CERTIFICATE_BASE64 }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
        run: bun run --cwd packages/desktop package --target mas --arch arm64 -- --publish never -c.mac.bundleVersion=${{ github.run_number }}

      # App Review's automated check, run first: 6.1.0 was rejected for 129 non-public symbols, every
      # one imported from the system ICU by the Bun it then shipped (specs/desktop.md §7.1). Every
      # Mach-O in the application is listed with its undefined symbols, and any import from
      # libicucore fails the lane, naming the binary, before anything reaches App Store Connect.
      - name: No binary imports the system ICU
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          app=$(find packages/desktop/artifacts -maxdepth 2 -name '*.app' -type d | head -n 1)
          if [ -z "$app" ]; then
            echo "::error::electron-builder produced no .app to scan"
            exit 1
          fi
          found=0
          while IFS= read -r -d '' file; do
            if ! file -b "$file" | grep -q 'Mach-O'; then
              continue
            fi
            if otool -L "$file" 2>/dev/null | grep -q 'libicucore'; then
              icu=$(nm -u -m "$file" 2>/dev/null | grep -c 'libicucore' || true)
              echo "::error file=$file::$file imports $icu symbol(s) from libicucore"
              nm -u -m "$file" 2>/dev/null | grep 'libicucore' | head -n 20
              found=1
            fi
          done < <(find "$app" -type f -print0)
          if [ "$found" -ne 0 ]; then
            exit 1
          fi
          echo "No Mach-O in $app imports libicucore."

      - name: Upload to App Store Connect
        if: steps.credentials.outputs.configured == 'true'
        run: |
          set -euo pipefail
          pkg=$(find packages/desktop/artifacts -maxdepth 2 -name '*.pkg' | head -n 1)
          if [ -z "$pkg" ]; then
            echo "::error::electron-builder produced no .pkg; the artifacts directory holds:"
            find packages/desktop/artifacts -maxdepth 2 | head -n 50
            exit 1
          fi
          echo "Uploading $pkg"
          xcrun altool --upload-app --type macos --file "$pkg" \
            --apiKey "${{ secrets.APPLE_API_KEY_ID }}" --apiIssuer "${{ secrets.APPLE_API_ISSUER_ID }}"

      - name: Clean up signing materials
        if: always() && steps.credentials.outputs.configured == 'true'
        run: |
          rm -f ~/.appstoreconnect/private_keys/AuthKey_*.p8
          rm -f packages/desktop/build-resources/embedded.provisionprofile

  # Needs only the API key and a Bun that can run a script with no dependencies, so it runs on Linux
  # rather than holding a macOS runner through the wait for Apple to process the build, which takes
  # minutes. Skipped when the upload was skipped (no secrets) or failed (nothing to submit).
  mas-submit:
    name: Submit to App Review
    needs: mas-publish
    if: inputs.submit && needs.mas-publish.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_name }}

      # `scripts/mas-submit.ts` imports nothing outside Node, so no install.
      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install: "false"

      # Waits for the build to finish processing, attaches it to the release's version (renaming a
      # rejected one rather than creating a second), fills in "What's New" where it is empty, and
      # submits. A version already waiting, in review or live is success; a different version in
      # review is a warning and leaves the build in TestFlight (scripts/mas-submit.ts).
      - name: Submit to App Review
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          BUILD_NUMBER: ${{ needs.mas-publish.outputs.build_number }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$APPLE_API_KEY_PATH"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          bun scripts/mas-submit.ts --build "$BUILD_NUMBER" --release-type "$RELEASE_TYPE"
