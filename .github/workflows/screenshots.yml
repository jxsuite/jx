# Lane 2 of the screenshot gate (scripts/screenshots/README.md, "The gate"), and the camera the
# site build calls.
#
# NO PICTURE IS COMMITTED. `docs/images/` and `scripts/screenshots/capture.lock.json` are build
# outputs: gitignored, written only by `bun run screenshots`, and made here. They were committed
# once, by this lane, to the branch of every pull request that moved a pixel. Git cannot
# delta-compress a PNG, so each re-capture stored a whole new one, and `docs/images` reached 741 MiB
# of an 868 MiB pack in under four months. The pictures are a pure function of a tree and a pinned
# browser, so they are computed where they are needed instead.
#
# One job, two callers:
#
#   * THE LANE (pull_request, push to main, nightly, manual). It captures over a BASELINE, the last
#     capture `main` saved to the Actions cache, and reports what differs: shot, changed-pixel %,
#     and the docs pages each changed image appears on, in the job summary, with the before and
#     after of every changed image as an artifact. A visual change is never a failure. Whether a
#     picture is *right* is an aesthetic judgement CI cannot make, and pretending otherwise is what
#     taught everyone to click past it. It goes RED only on a shot error (a failed `expect`, an
#     unknown command id, an unresolvable region, an `idle()` timeout) or on a capture that is not
#     what the manifest describes.
#   * THE SITE BUILD (`workflow_call` with `ref`, from deploy-site.yml). It captures the tree being
#     published from nothing, with no baseline and `--force`, and hands the result over as the
#     `docs-images` artifact. The published pictures are therefore exactly the Studio that shipped,
#     and never a restored image that was merely within the diff threshold of it.
#
# The token is read-only, deliberately. Nothing is pushed and nothing is commented, so a fork's pull
# request runs exactly as a branch's does, and deploy-site.yml (which grants `contents: read`) can
# call this file at all: a called workflow may not ask for more than its caller holds.
#
# Lane 1 (`scripts/check-shot-contract.ts`, in the `checks` job) is semantically blind: a command
# that still exists and now means something different sails through it green. That is what this
# lane is for, and why it is not nightly-only.

name: Screenshots

on:
  pull_request:
    paths:
      # The surfaces a picture is OF. `packages/starters/**` was too wide: a starters README
      # cannot move a pixel, and the only starter inputs a shot opens are the project roots.
      - "packages/studio/src/**"
      # The project roots shots actually open. GENERATED, and guarded:
      # scripts/screenshots/shot-paths.test.ts asserts this list is exactly the set of
      # `open.project` values in the manifest that live outside `scripts/screenshots/`. Most
      # starters are photographed by nothing, and `examples` was photographed by
      # `data-source-request` while matching no filter at all — the derivation finds both.
      - "examples/**"
      - "packages/starters/sites/blog/**"
      - "packages/starters/sites/course/**"
      - "packages/starters/sites/event/**"
      - "packages/starters/sites/real-estate/**"
      - "packages/starters/sites/restaurant/**"
      - "packages/starters/sites/shop/**"
      # Every starter is in ONE picture regardless of `open.project`: `new-project` photographs the
      # new-project modal, whose gallery is `listStarters()` reading this file.
      - "packages/starters/registry.json"
      # The pipeline itself, and the lock's own definition.
      - "scripts/screenshots/**"
      - "scripts/check-image-lock.ts"
      - "scripts/lib/png.ts"
      # NOT this file. It listed itself, so a dependabot bump of an action version — a diff that
      # cannot change a picture — booted the container and re-captured every shot. Editing the
      # *steps* has `workflow_dispatch`.
  # The run that SAVES the baseline. A pull request can restore a cache its base branch wrote and
  # never one another pull request wrote, so the baseline every report compares against has to be
  # made on `main`. Same filter: a push that cannot move a picture has no new baseline to offer.
  #
  # The list is the pull request's, written out again: scripts/screenshots/shot-paths.test.ts holds
  # the two to each other, so they cannot drift.
  push:
    branches: [main]
    paths:
      - "packages/studio/src/**"
      - "examples/**"
      - "packages/starters/sites/blog/**"
      - "packages/starters/sites/course/**"
      - "packages/starters/sites/event/**"
      - "packages/starters/sites/real-estate/**"
      - "packages/starters/sites/restaurant/**"
      - "packages/starters/sites/shop/**"
      - "packages/starters/registry.json"
      - "scripts/screenshots/**"
      - "scripts/check-image-lock.ts"
      - "scripts/lib/png.ts"
  # Nightly, on `main`. Catches drift no pull request caused (a base-image rebuild, a font package)
  # and keeps the baseline from ageing out: Actions evicts a cache nothing has read for seven days.
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Tree to capture for publication. Its pictures are taken fresh, with no baseline."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # A publishing capture is its own group and is never cancelled: it runs on `main`'s ref, where it
  # would otherwise share a group with the lane's push run and one would cancel the other.
  group: screenshots-${{ inputs.ref && format('publish-{0}', inputs.ref) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.ref }}

jobs:
  capture:
    runs-on: ubuntu-latest
    # A dependency bump cannot be reviewed as a visual change, and its author is a bot nobody is
    # waiting on. The nightly catches what one moves.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    # Pinned for the fonts as much as for the browser: the chrome's sans stack resolves against
    # whatever families are installed, and the capture lock records the fontset for that reason.
    container:
      image: ghcr.io/puppeteer/puppeteer:25.4.0
      options: --user root
    env:
      PUPPETEER_SKIP_DOWNLOAD: "1"
      TZ: UTC
      LANG: C.UTF-8
      # The two paths that ARE a capture. deploy-site.yml restores the same cache with the same
      # list; `actions/cache` hashes the list into the cache's version, so they must not differ.
      CAPTURE_PATHS: |
        docs/images
        scripts/screenshots/capture.lock.json

    steps:
      # The job runs as root inside the container while the workspace is owned by the runner's
      # user, and git refuses to operate on a tree it does not own. Set before the checkout so the
      # action's own post-step is covered too.
      - name: Trust the container workspace
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@v7
        with:
          # Empty for the lane, which is exactly the action's default (the triggering ref).
          ref: ${{ inputs.ref || github.event.pull_request.head.sha }}
          # The merge base has to exist locally: it names the baseline, and it scopes the capture.
          fetch-depth: 0
          persist-credentials: false

      # fontconfig so the lock can record the fontset; zstd so the cache this job saves is one the
      # site build can restore. `actions/cache` compresses with zstd when it finds it and gzip when
      # it does not, and the compression method is part of the cache's version: a gzip cache saved
      # here is invisible to a runner that has zstd, which every hosted runner does.
      - name: Install fontconfig and zstd
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v fc-list >/dev/null || ! command -v zstd >/dev/null; then
            apt-get update -qq && apt-get install -y -qq fontconfig zstd
          fi
          # Recorded in the log so a lock whose `fontset` id moved can be explained without guessing.
          fc-list --format '%{family[0]}\n' | sort -u | wc -l

      # ── The baseline (the lane only) ───────────────────────────────────────
      # Keys are `screenshots-v1-<tree>-<commit>-<run>`. The primary key below never exists, so
      # this always falls through to the prefixes: first a capture of the merge base's own tree,
      # then the most recent capture this ref can see, which for a pull request is `main`'s. The
      # key that matched carries the commit it was captured at, and the report names it.
      - name: Name the baseline
        id: keys
        if: inputs.ref == ''
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          base=HEAD
          if [ -n "${BASE_REF}" ]; then
            base=$(git merge-base "origin/${BASE_REF}" HEAD || echo HEAD)
          fi
          echo "base_tree=$(git rev-parse "${base}^{tree}")" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore the baseline capture
        id: baseline
        if: inputs.ref == ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.CAPTURE_PATHS }}
          key: screenshots-v1-restore-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            screenshots-v1-${{ steps.keys.outputs.base_tree }}-
            screenshots-v1-

      - name: Snapshot the baseline
        id: before
        if: inputs.ref == ''
        shell: bash
        env:
          MATCHED: ${{ steps.baseline.outputs.cache-matched-key }}
          BASE_TREE: ${{ steps.keys.outputs.base_tree }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/before/docs/images
          if [ -f scripts/screenshots/capture.lock.json ] && [ -d docs/images ]; then
            cp -r docs/images/. /tmp/before/docs/images/
            cp scripts/screenshots/capture.lock.json /tmp/before/capture.lock.json
            commit=$(echo "${MATCHED}" | cut -d- -f4 | cut -c1-7)
            case "${MATCHED}" in
              "screenshots-v1-${BASE_TREE}-"*) what="main at ${commit}, the merge base's own tree" ;;
              *) what="main at ${commit}, the most recent capture" ;;
            esac
            echo "restored=true" >> "$GITHUB_OUTPUT"
            echo "what=${what}" >> "$GITHUB_OUTPUT"
            echo "Baseline: ${what} (${MATCHED})"
          else
            # A first run, or one after the cache was evicted. Half a capture is no baseline at
            # all, so anything partial is cleared and every shot is taken.
            rm -rf docs/images scripts/screenshots/capture.lock.json
            echo "restored=false" >> "$GITHUB_OUTPUT"
            echo "No baseline capture was restored; every shot will be taken."
          fi

      - uses: ./.github/actions/setup-bun

      # The picture must be of the working tree's bundle. The runner asserts bundle freshness and
      # will refuse a stale dist rather than photograph one.
      # No compiler addon here: the pinned browser container has no Rust and no rights to install
      # one, and no shot optimizes an image (Studio renders sources, and the thumbnails build with
      # optimization off). A shot that ever needs one fails naming `bun run build:addon`.
      - run: bun run build
        env:
          JX_ADDON_BUILD: skip

      # CHROMIUM_BIN is the contract every entry point documents (README, run.ts, thumbnails.ts)
      # and the first candidate `findChromium()` tries.
      #
      # ASK THE IMAGE, do not guess at it. The first attempt hardcoded /root/.cache/puppeteer and
      # found nothing — the image installs browsers under its own `pptruser` home, and Actions runs
      # steps with HOME=/github/home, so neither `~` nor root's cache is the answer. The image has
      # Puppeteer itself installed, and `executablePath()` is the authoritative answer; the search
      # is only there for the day that stops being true. Failing loudly beats falling back to a
      # system browser: the lock records a Chromium major, and bytes from an unrecorded binary are
      # a capture nobody can reproduce.
      - name: Resolve the container's Chrome for Testing
        shell: bash
        run: |
          set -uo pipefail
          bin=$(node -e "try{process.stdout.write(require('puppeteer').executablePath())}catch(e){}" 2>/dev/null || true)
          if [ ! -x "${bin:-}" ]; then
            bin=$(find / -xdev -type f -path '*/chrome-linux64/chrome' -perm -u+x 2>/dev/null \
              | sort | tail -n 1)
          fi
          if [ ! -x "${bin:-}" ]; then
            echo "::error::No Chrome for Testing in this image. Diagnostics follow."
            echo "HOME=$HOME  PUPPETEER_CACHE_DIR=${PUPPETEER_CACHE_DIR:-unset}"
            ls -la /home 2>&1 | head -10
            find / -xdev -maxdepth 6 -type d -name puppeteer 2>/dev/null | head -10
            exit 1
          fi
          echo "CHROMIUM_BIN=$bin" >> "$GITHUB_ENV"
          # Logged because the lock's runtime triple records the Chromium major: when a picture
          # changes for no visible reason, this line is what says the browser moved.
          "$bin" --version

      # Which shots to take, and how.
      #
      #   * PUBLISHING: every shot, `--force`. `--force` skips `writeIfChanged`, the comparison that
      #     keeps an existing PNG when the new one is within `DIFF_THRESHOLD` of it. There is no
      #     existing PNG here, and the flag says so rather than leaving it to an empty directory.
      #   * THE LANE WITH A BASELINE: no `--force`, so an image whose pixels did not move keeps its
      #     baseline bytes and the report lists only pictures that changed. On a pull request the
      #     run is also NARROWED to the shots its diff can move (scripts/screenshots/affected.ts):
      #     a shot names the project it opens, so a change confined to project roots cannot move
      #     any other picture. The untaken shots keep the baseline's images.
      #   * THE LANE WITHOUT ONE: every shot. Narrowing over nothing would leave a capture with
      #     holes in it, which is the one thing the verify step below exists to refuse.
      - name: Scope the capture
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          PUBLISH_REF: ${{ inputs.ref }}
          RESTORED: ${{ steps.before.outputs.restored }}
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_REF}" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "only=--force" >> "$GITHUB_OUTPUT"
          elif [ "${RESTORED}" != "true" ]; then
            echo "mode=all" >> "$GITHUB_OUTPUT"
            echo "only=" >> "$GITHUB_OUTPUT"
          else
            bun scripts/screenshots/affected.ts
          fi

      # `bun run screenshots` exits non-zero on a failed `expect`, an unknown command id, an
      # unresolvable region or an `idle()` timeout — and on nothing else. It is `continue-on-error`
      # so the report is still written when it fails (a broken shot is exactly when you want to see
      # which pictures went with it); the explicit gate at the end of the job re-raises it.
      - name: Capture
        id: capture
        # `none` means every shot this diff could change is quarantined. It cannot be expressed as
        # an empty `--only`, which the runner reads as ALL shots.
        if: steps.scope.outputs.mode != 'none'
        continue-on-error: true
        shell: bash
        run: bun run screenshots ${{ steps.scope.outputs.only }}

      # The capture has to be the WHOLE manifest, produced by the runner, at this tree's shot
      # definitions. This failing means the pipeline is broken, or the baseline it captured over
      # was not a capture — not that a picture changed. So it is also red.
      - name: Verify the capture
        id: verify
        continue-on-error: true
        shell: bash
        run: bun scripts/check-image-lock.ts --capture

      # ── The lane: report, and save the next baseline ───────────────────────
      - name: Build the report
        id: report
        if: inputs.ref == ''
        shell: bash
        env:
          RESTORED: ${{ steps.before.outputs.restored }}
          BASELINE: ${{ steps.before.outputs.what }}
        run: |
          set -euo pipefail
          args=()
          if [ "${RESTORED}" = "true" ]; then
            args+=(--before-lock /tmp/before/capture.lock.json)
            args+=(--before-images /tmp/before/docs/images)
            args+=(--baseline "${BASELINE}")
          fi
          bun scripts/check-image-lock.ts --report /tmp/screenshots-report.md \
            --artifact screenshots-changed --changed-dir /tmp/changed "${args[@]}" > /dev/null
          cat /tmp/screenshots-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -d /tmp/changed ]; then
            cp /tmp/screenshots-report.md /tmp/changed/report.md
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Screenshots::Pictures changed. The job summary lists them and the docs pages they appear on; the screenshots-changed artifact holds each before and after."
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the changed pictures
        if: steps.report.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-changed
          path: /tmp/changed
          retention-days: 14

      # Saved by `main` only, and only when the capture is one a later run may build on. A pull
      # request's capture is never a baseline: the cache prefers a ref's own entries, so its next
      # push would be compared with its previous push instead of with `main`, and the report would
      # stop saying what the pull request changes.
      - name: Save the capture as the next baseline
        if: >-
          inputs.ref == '' &&
          github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          steps.capture.outcome == 'success' &&
          steps.verify.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.CAPTURE_PATHS }}
          key: screenshots-v1-${{ steps.keys.outputs.tree }}-${{ steps.keys.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ── Publishing: hand the capture to the site build ─────────────────────
      # Only a capture that verified. The site build verifies it again after the download, because
      # an artifact is bytes that crossed a job boundary and the lock is what says they arrived.
      - name: Upload the capture
        if: >-
          inputs.ref != '' &&
          steps.capture.outcome == 'success' &&
          steps.verify.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: docs-images
          path: ${{ env.CAPTURE_PATHS }}
          if-no-files-found: error
          retention-days: 7

      # The only two conditions that are allowed to fail this job.
      - name: Fail on a shot error
        if: steps.capture.outcome == 'failure' || steps.verify.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::A shot errored, or the capture is not what the manifest describes."
          echo "A changed picture is never a failure here; a broken shot is. See the steps above."
          exit 1
