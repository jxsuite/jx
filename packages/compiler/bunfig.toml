[test]
# Before every file: the shared guards (packages/test-support/src/preload.ts). DOM nodes print as
# one line in failure output, deep equality on a DOM node is refused before Bun's diff printer can
# hang on it, and a local Bun other than CI's pin says so once.
preload = ["@jxsuite/test-support/preload"]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  # The shared preload is gated by packages/test-support's own run, at 100%.
  "../test-support/**",
  "./result/**",
  # Transient /tmp modules some tests import (portability worker copy, importImplementation
  # fixtures, the bundled locale worker) — loaded artifacts, not compiler source. Each is a
  # BUNDLE: the coverage it reports is hono's plus the generated entry's, so instrumenting it
  # measures a dependency and fails the per-file gate on code this workspace does not own.
  "**/jx-worker-portability-*/**",
  "**/jx-import-impl-*/**",
  "**/jx-locale-worker-*/**",
  # The emitted runtime subpath a client-runtime test LOADS, to prove it exports the module's real
  # API rather than a re-export of itself. The file is lit-html's code bundled into a temp site.
  "**/jx-subpath-*/**",
  # The slot helper source the agreement test writes to a temp module and imports, so it can run
  # the exact text every compiled component module inlines. Generated output, not compiler source.
  "**/jx-slot-helper-*/**",
  "../../extensions/**",
  "../create/**",
  "../desktop/**",
  "../markup/**",
  "../parser/**",
  "../runtime/**",
  "../schema/**",
  "../server/**",
  "../site/**",
  "../studio/**",
]
coverageThreshold = { lines = 0.982, functions = 0.98 }
