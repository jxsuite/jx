[test]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  "./result/**",
  "../../extensions/**",
  # @jxsuite/server's AI routes now run @jxsuite/ai/gateway, so loading the server loads its files,
  # which land here barely exercised and fail the per-file gate while being gated at 0.99 under
  # packages/ai's own run. Same rule as `../protocol/**` below.
  "../ai/**",
  "../collab/**",
  "../compiler/**",
  "../create/**",
  "../markup/**",
  "../parser/**",
  # Was missing from this list, so `../protocol/src/routes.ts` landed in desktop's coverage data at
  # 33% functions and failed the per-file gate here — while being 100% under packages/protocol's own
  # run, where it is gated at 0.99. A sibling's files belong to that sibling's job.
  "../protocol/**",
  "../runtime/**",
  "../schema/**",
  "../server/**",
  "../site/**",
  "../starters/**",
  "../studio/**",
  # `platform.test.ts` reads the kit's own KIT_TAGS, so the tags the update notice writes are held
  # to the package that defines them rather than to a memory of them. That file is 100% under
  # packages/ui's own run today, so listing it here changes no number — it is here for the same
  # reason `../protocol/**` is, and before rather than after.
  "../ui/**",
]
coverageThreshold = { lines = 0.96, functions = 0.90 }
