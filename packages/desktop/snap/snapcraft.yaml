# Jx Studio for the Snap Store (specs/desktop.md §9.6).
#
# The snap carries the same Electron application every other channel ships: electron-builder's
# unpacked Linux build (`bun run package --target linux -- --dir`), staged into `snap-stage/` by
# build-snap.yml before this runs. It brings its own Electron and the Bun that runs its backend, so
# nothing here installs either.
#
# The gnome extension supplies GTK and the host-matched GPU stack (gpu-2404 Mesa). Whether the
# official Electron prebuilt renders with hardware acceleration through it is unmeasured, and the
# first store build is where that shows.
#
# Chromium is Canonical's own build, copied from the official `chromium` snap. It is not the shell:
# it is the browser the site import drives through puppeteer, which cannot open a page in Electron.
name: jx-studio
title: Jx Studio
summary: Visual editor for Jx components, pages and sites
description: |
  Jx Studio is the visual editor for Jx projects: design components, pages and layouts on a live
  canvas, edit their JSON source side by side, and preview the site as you build it.
license: MIT
website: https://jxsuite.com
contact: https://github.com/jxsuite/jx/issues
issues: https://github.com/jxsuite/jx/issues
source-code: https://github.com/jxsuite/jx
icon: icon.png
adopt-info: app
base: core24
confinement: strict
grade: stable

platforms:
  amd64:
  arm64:

apps:
  jx-studio:
    command: bin/jx-studio
    extensions: [gnome]
    plugs:
      # Chromium's shared-memory and IPC conventions, for Electron and for the import browser.
      # allow-sandbox is not requested (the store grants it only to trusted publishers), so the
      # launcher passes --no-sandbox.
      - browser-support
      - home
      - network
      # Each window's studio is served from a loopback HTTP + WebSocket server.
      - network-bind
      - removable-media
    environment:
      # The site import's browser (packages/import reads CHROME_PATH).
      CHROME_PATH: $SNAP/usr/lib/chromium-browser/chrome
      # The libraries the chromium snap stages beside its binary (NSS, libsecret, Kerberos, …),
      # which the gnome runtime does not carry. Same path the chromium snap itself adds.
      LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR
      GTK_USE_PORTAL: "1"

parts:
  app:
    plugin: dump
    source: snap-stage
    # Everything under app/: the executable, Electron's libraries and `resources/`.
    organize:
      "*": app/
    # What Electron links against that neither the gnome runtime nor Chromium's staged libraries
    # carry.
    stage-packages:
      - libasound2t64
      - libgbm1
      - libnotify4
      - libnspr4
      - libnss3
      - libxss1
      - libxtst6
    override-build: |
      craftctl default
      # Electron's own sandbox helper is setuid, and the store refuses a setuid file. It is the
      # helper of the sandbox this snap does not start (--no-sandbox, snap/local/jx-studio).
      rm -f "$CRAFT_PART_INSTALL/chrome-sandbox"
      craftctl set version="$(cat "$CRAFT_PART_SRC/version.txt")"

  launcher:
    plugin: nil
    source: snap/local
    # `install -m` rather than `dump`: the mode bit does not survive every checkout.
    override-build: install -Dm755 "$CRAFT_PART_SRC/jx-studio" "$CRAFT_PART_INSTALL/bin/jx-studio"

  chromium:
    plugin: nil
    build-snaps: [chromium/latest/stable]
    override-build: |
      from=/snap/chromium/current/usr/lib
      to="$CRAFT_PART_INSTALL/usr/lib"
      mkdir -p "$to"
      cp -a "$from/chromium-browser" "$to/"
      cp -a "$from/$CRAFT_ARCH_TRIPLET_BUILD_FOR" "$to/"
      # A test driver, not part of the browser.
      rm -f "$to/chromium-browser/chromedriver"
      # Setuid in the chromium snap, and the store refuses a setuid file. It is the helper of the
      # sandbox this snap does not start (--no-sandbox, snap/local/jx-studio).
      rm -f "$to/chromium-browser/chrome-sandbox"
