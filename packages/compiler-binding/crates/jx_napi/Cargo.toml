[package]
name = "jx_napi"
description = "The Node-API face of the Jx compiler core, published as @jxsuite/compiler-binding."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# Not `workspace = true`: napi-derive expands to `unsafe` FFI glue, which the workspace forbids.
# Everything else is the workspace's set, restated.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
must_use_candidate = "allow"

[dependencies]
jx_media = { path = "../jx_media" }
napi = { version = "3", default-features = false, features = ["napi8", "async"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
