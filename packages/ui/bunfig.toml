[test]
# Before every file: the shared guards (packages/test-support/src/preload.ts). DOM nodes print as
# one line in failure output, deep equality on a DOM node is refused before Bun's diff printer can
# hang on it, and a local Bun other than CI's pin says so once.
preload = ["@jxsuite/test-support/preload"]
coverageReporter = ["text", "lcov"]
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "**/tests/**",
  # The shared preload is gated by packages/test-support's own run, at 100%.
  "../test-support/**",
  "**/scripts/**",
  "./result/**",
  "../runtime/**",
  "../schema/**",
  # A sibling workspace's sources are gated by that workspace's own bunfig, not by this one. The
  # theme test imports the site builder to prove the two agree about one style block, and without
  # this line that import drags `site-style.ts` into the kit's report, where it trips a per-file
  # bar it was never measured against — a red gate in `packages/ui` owned by `packages/site`.
  "../site/**",
]
coverageThreshold = { lines = 0.99, functions = 1.0 }
